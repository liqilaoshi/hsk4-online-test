        <!-- ==================== 第三部分 (66-85题) ==================== -->
        <div class="section-title">第三部分：阅读理解（第66-85题）</div>
        <script>
            const p3Data = {
                66: { text: "每个人都有缺点,再优秀的人也一样。我们总是很容易看到一个人的缺点,但是别忘了,他身上的优点更值得我们去发现、去学习。<br><strong>★ 这段话提醒我们要：</strong>", ans: "D", opts: ["A. 有耐心", "B. 接受批评", "C. 学会原谅", "D. 看到别人的优点"] },

                69: { text: "有些人通过节食的方法来减肥,虽然有效,但是时间长了身体会受不了。真正健康的减肥方法应该是多锻炼,这样做既对身体好,还能让自己看起来更有精神。<br><strong>★ 想要健康减肥,应该：</strong>", ans: "A", opts: ["A. 多运动", "B. 少吃米饭", "C. 经常站着", "D. 多玩儿电子游戏"] },
                70: { text: "张先生,这儿离你们公司也就两三站的距离,周围环境不错,对面有超市和银行,房租也不贵,您要不要再考虑一下？<br><strong>★ 张先生：</strong>", ans: "C", opts: ["A. 被骗了", "B. 住在附近", "C. 在找房子", "D. 在看广告"] },

                72: { text: "如果一个人必须要完成一件自己不喜欢的事情,最好的办法就是早点儿把它做完,这样才能提前结束烦恼。<br><strong>★ 对不喜欢却又必须做的事,最好：</strong>", ans: "C", opts: ["A. 找人帮忙", "B. 交给别人", "C. 早点儿完成", "D. 留到最后做"] },
                73: { text: "老教授对新生说:“从今天起,如果你每天用100字把自己的生活写下来,毕业时你将会得到一本10多万字的书,内容就是你4年大学生活的美好回忆。”<br><strong>★ 老教授希望学生：</strong>", ans: "D", opts: ["A. 诚实", "B. 别太得意", "C. 经常复习", "D. 记下自己的生活"] },
                74: { text: "语言是人们交流的工具,音乐也是一种语言,人们可以用它来表达自己的感情,而且和其他语言比起来,音乐表达的感情有时更容易让人听懂。<br><strong>★ 根据这段话,音乐表达的感情：</strong>", ans: "C", opts: ["A. 复杂多变", "B. 让人难过", "C. 更容易理解", "D. 让人印象更深"] },

                77: { text: "他平时就对自己要求很严格,尤其是赛前那个星期,他每天都会把全部动作练习好几遍,希望在比赛中做到最好。<br><strong>★ 比赛前,他：</strong>", ans: "A", opts: ["A. 更努力", "B. 十分兴奋", "C. 非常着急", "D. 停止了练习"] },

                79: { text: "叶诗文是中国著名的游泳运动员,她6岁时就比同龄人高不少,老师看她手脚也大,身体其他条件也很符合游泳运动员的要求,就鼓励她专门去学游泳。尽管她现在只有16岁,但已经获得了好几个国际大奖。<br><strong>★ 老师鼓励叶诗文学游泳,是因为觉得她：</strong>", ans: "D", opts: ["A. 聪明", "B. 跑得快", "C. 获过奖", "D. 身体条件好"] },
                80: { text: "目的地也许只有一个,但是通往目的地的道路却有很多条。所以,当一条路走不通时,我们可以换另外一条试试。只要我们不放弃努力,总会找到一条合适的路,通往成功的目的地。<br><strong>★ 当一条路走不通时,我们应该：</strong>", ans: "B", opts: ["A. 看地图", "B. 试试别的路", "C. 向当地人问路", "D. 给朋友打电话"] },

                83: { text: "（续上题）<strong>★ 根据这段话,可以知道：</strong>", ans: "C", opts: ["A. 小说半价", "B. 放寒假了", "C. 有些书打折", "D. 书店生意很好"] },

        </script>

        <div class="btn-container">
            <button type="button" class="submit-btn" onclick="checkAnswers()">提交并查看批改结果</button>
        </div>
    </form>

    <div id="resultBox" class="result-box"></div>
</div>

<script>
let timerInterval = null;
let timeLeft = 40 * 60; // 40分钟
let isStarted = false;

function startTimer() {
    if (isStarted) return;
    isStarted = true;
    
    const startBtn = document.getElementById('startBtn');
    startBtn.textContent = "考试进行中";
    startBtn.style.backgroundColor = "#e67e22";
    startBtn.disabled = true;

    const timerElement = document.getElementById('timer');
    
    timerInterval = setInterval(() => {
        let minutes = Math.floor(timeLeft / 60);
        let seconds = timeLeft % 60;
        
        minutes = minutes < 10 ? '0' + minutes : minutes;
        seconds = seconds < 10 ? '0' + seconds : seconds;
        
        timerElement.textContent = minutes + ':' + seconds;
        
        if (timeLeft <= 0) {
            clearInterval(timerInterval);
            alert('时间到！系统将为您自动提交阅读试卷。');
            checkAnswers();
        }
        timeLeft--;
    }, 1000);
}

function checkAnswers() {
    if (timerInterval) {
        clearInterval(timerInterval);
    }
    
    const questionBoxes = document.querySelectorAll('.question-box');
    let score = 0;
    let total = questionBoxes.length;

    questionBoxes.forEach(box => {
        const qid = box.getAttribute('data-qid');
        const correctAnswer = box.getAttribute('data-answer');
        const selectedInput = box.querySelector(`input[name="q${qid}"]:checked`);
        const feedbackDiv = box.querySelector('.feedback');

        box.style.borderColor = "#e0e0e0";
        feedbackDiv.innerHTML = "";

        if (!selectedInput) {
            box.style.borderColor = "#f39c12";
            feedbackDiv.innerHTML = `<div class="wrong-ans">未作答！正确答案是：${correctAnswer}</div>`;
        } else {
            const userAnswer = selectedInput.value;
            if (userAnswer === correctAnswer) {
                score++;
                box.style.borderColor = "#27ae60";
                box.style.backgroundColor = "#f4fbf7";
                feedbackDiv.innerHTML = `<div class="correct-ans">回答正确！✓</div>`;
            } else {
                box.style.borderColor = "#c0392b";
                box.style.backgroundColor = "#fdf5f5";
                feedbackDiv.innerHTML = `<div class="wrong-ans">回答错误。你的选择 ${userAnswer}，正确答案是：<strong>${correctAnswer}</strong></div>`;
            }
        }
    });

    const resultBox = document.getElementById('resultBox');
    resultBox.style.display = "block";
    resultBox.style.backgroundColor = score === total ? "#d4edda" : "#e2e3e5";
    resultBox.style.color = score === total ? "#155724" : "#383d41";
    resultBox.innerHTML = `测试完成！您的阅读总得分是：${score} / ${total} 题`;
    
    resultBox.scrollIntoView({ behavior: 'smooth' });
}
</script>

</body>
</html>
